# Koroki-only MCP integrations. Personal model and notification defaults remain global.

[mcp_servers.serena]
command = 'C:\Users\Shinn\.local\bin\serena.exe'
args = ["start-mcp-server", "--project-from-cwd", "--context=codex", "--open-web-dashboard=false"]
cwd = ".."
startup_timeout_sec = 60
tool_timeout_sec = 240
required = false
default_tools_approval_mode = "writes"

[mcp_servers.github]
command = 'C:\Users\Shinn\AppData\Local\Programs\Python\Launcher\py.exe'
args = ["-3.12", "scripts/start_github_mcp.py"]
cwd = ".."
startup_timeout_sec = 30
tool_timeout_sec = 60
required = false
default_tools_approval_mode = "auto"
