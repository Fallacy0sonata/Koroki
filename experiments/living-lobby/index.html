<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Koroki Living Lobby - Prototype</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      box-sizing: border-box;
      z-index: 10;
    }
    .controls {
      pointer-events: auto;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      gap: 1rem;
      max-width: fit-content;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  
  <div id="ui-layer">
    <div class="controls">
      <!-- We will inject controls here to test teleporting and poses -->
      <button id="btn-bed">Go to Bed</button>
      <button id="btn-desk">Go to Desk</button>
      <button id="btn-window">Go to Window</button>
      <button id="btn-expression">Change Expression</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
