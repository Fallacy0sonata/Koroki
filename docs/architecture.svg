<svg viewBox="0 0 1180 1040" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .panel { fill:#161923; stroke:#333a4d; stroke-width:1.2; }
    .chip  { fill:#1b2030; stroke:#3a4157; stroke-width:1; }
    .orch  { fill:#1a1520; stroke:#8a4f6b; stroke-width:1.5; }
    .safe  { fill:#1b2030; stroke:#ff9a62; stroke-width:1.2; }
    .full  { fill:#1b2030; stroke:#ff9a62; stroke-width:1.2; }
    .tier  { fill:#7b8296; font-size:12px; font-weight:600; letter-spacing:2.5px; }
    .t     { fill:#e9ecf4; font-size:14px; font-weight:600; }
    .tt    { fill:#e9ecf4; font-size:16px; font-weight:600; }
    .s     { fill:#9aa3ba; font-size:11px; }
    .rose  { fill:#e37ba0; }
    .ember { fill:#ff9a62; }
    .ln    { stroke:#4a5268; stroke-width:1.2; fill:none; }
    .lnd   { stroke:#4a5268; stroke-width:1.2; fill:none; stroke-dasharray:4 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a5268"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="1040" fill="#0e1016"/>

  <!-- SURFACES -->
  <text x="60" y="38" class="tier">SURFACES</text>
  <rect x="60"  y="52" width="150" height="44" rx="10" class="panel"/>
  <text x="135" y="79" class="t" text-anchor="middle">Discord</text>
  <rect x="224" y="52" width="110" height="44" rx="10" class="panel"/>
  <text x="279" y="79" class="t" text-anchor="middle">Web</text>
  <rect x="348" y="52" width="110" height="44" rx="10" class="panel"/>
  <text x="403" y="79" class="t" text-anchor="middle">Twitch</text>
  <rect x="472" y="52" width="140" height="44" rx="10" class="panel"/>
  <text x="542" y="79" class="t" text-anchor="middle">OBS · Stream</text>
  <rect x="940" y="52" width="180" height="44" rx="10" class="panel" stroke-dasharray="4 4"/>
  <text x="1030" y="72" class="t" text-anchor="middle" font-size="13">Config</text>
  <text x="1030" y="88" class="s" text-anchor="middle">one settings file</text>

  <line x1="135" y1="96" x2="135" y2="134" class="ln" marker-end="url(#arr)"/>
  <line x1="279" y1="96" x2="279" y2="134" class="ln" marker-end="url(#arr)"/>
  <line x1="403" y1="96" x2="403" y2="134" class="ln" marker-end="url(#arr)"/>
  <line x1="542" y1="96" x2="542" y2="134" class="ln" marker-end="url(#arr)"/>
  <line x1="1030" y1="96" x2="1030" y2="134" class="lnd" marker-end="url(#arr)"/>

  <!-- ORCHESTRATOR -->
  <rect x="60" y="140" width="1060" height="336" rx="14" class="orch"/>
  <text x="84" y="172" class="tt"><tspan class="rose">Orchestrator</tspan> — the captain's cabin</text>
  <text x="84" y="193" class="s">the only public surface · validates every request · assembles her context · streams her reply</text>

  <rect x="76" y="212" width="196" height="116" rx="10" class="chip"/>
  <text x="90" y="238" class="t">Emotion engine</text>
  <text x="90" y="262" class="s">her real mood — caused by</text>
  <text x="90" y="278" class="s">events, fading with time</text>

  <rect x="284" y="212" width="196" height="116" rx="10" class="chip"/>
  <text x="298" y="238" class="t">Memory</text>
  <text x="298" y="262" class="s">long-term, per person</text>
  <text x="298" y="278" class="s">recall · beliefs · relationship</text>

  <rect x="492" y="212" width="196" height="116" rx="10" class="chip"/>
  <text x="506" y="238" class="t">Proactive drive</text>
  <text x="506" y="262" class="s">she acts unprompted</text>
  <text x="506" y="278" class="s">eligibility · cooldowns</text>

  <rect x="700" y="212" width="196" height="116" rx="10" class="chip"/>
  <text x="714" y="238" class="t">World &amp; body</text>
  <text x="714" y="262" class="s">time · weather · body state</text>
  <text x="714" y="278" class="s">felt, never labelled</text>

  <rect x="908" y="212" width="196" height="116" rx="10" class="chip"/>
  <text x="922" y="238" class="t">Sleep · dreams · journal</text>
  <text x="922" y="262" class="s">a real daily life</text>
  <text x="922" y="278" class="s">wakes on schedule, grumpy</text>

  <rect x="76" y="344" width="196" height="116" rx="10" class="chip"/>
  <text x="90" y="370" class="t">Wondering</text>
  <text x="90" y="394" class="s">a thought every few minutes</text>
  <text x="90" y="410" class="s">keep · note · look up · tell</text>

  <rect x="284" y="344" width="196" height="116" rx="10" class="chip"/>
  <text x="298" y="370" class="t">Curiosity &amp; lookup</text>
  <text x="298" y="394" class="s">checks before claiming</text>
  <text x="298" y="410" class="s">words · facts · references</text>

  <rect x="492" y="344" width="196" height="116" rx="10" class="chip"/>
  <text x="506" y="370" class="t">Taste &amp; fixations</text>
  <text x="506" y="394" class="s">develops likes of her own</text>
  <text x="506" y="410" class="s">brings them up herself</text>

  <rect x="700" y="344" width="196" height="116" rx="10" class="chip"/>
  <text x="714" y="370" class="t">Social judgment</text>
  <text x="714" y="394" class="s">who to answer · who to ignore</text>
  <text x="714" y="410" class="s">silence must have a reason</text>

  <rect x="908" y="344" width="196" height="116" rx="10" class="chip"/>
  <text x="922" y="370" class="t">Little rituals</text>
  <text x="922" y="394" class="s">morning catch-up · humming</text>
  <text x="922" y="410" class="s">a plant she tends</text>

  <!-- MODEL SERVICES -->
  <text x="60" y="512" class="tier">MODEL SERVICES</text>
  <line x1="145"  y1="476" x2="145"  y2="522" class="lnd" marker-end="url(#arr)"/>
  <line x1="323"  y1="476" x2="323"  y2="522" class="lnd" marker-end="url(#arr)"/>
  <line x1="501"  y1="476" x2="501"  y2="522" class="lnd" marker-end="url(#arr)"/>
  <line x1="679"  y1="476" x2="679"  y2="522" class="lnd" marker-end="url(#arr)"/>
  <line x1="857"  y1="476" x2="857"  y2="522" class="lnd" marker-end="url(#arr)"/>
  <line x1="1035" y1="476" x2="1035" y2="522" class="lnd" marker-end="url(#arr)"/>

  <rect x="62" y="526" width="166" height="96" rx="10" class="panel"/>
  <text x="76" y="554" class="t">Language</text>
  <text x="76" y="578" class="s">local LLM + her</text>
  <text x="76" y="594" class="s">trained persona</text>

  <rect x="240" y="526" width="166" height="96" rx="10" class="panel"/>
  <text x="254" y="554" class="t">Voice · EN</text>
  <text x="254" y="578" class="s">emotional speech,</text>
  <text x="254" y="594" class="s">real time</text>

  <rect x="418" y="526" width="166" height="96" rx="10" class="panel"/>
  <text x="432" y="554" class="t">Voice · JP</text>
  <text x="432" y="578" class="s">bilingual — light</text>
  <text x="432" y="594" class="s">enough for CPU</text>

  <rect x="596" y="526" width="166" height="96" rx="10" class="panel"/>
  <text x="610" y="554" class="t">Vision</text>
  <text x="610" y="578" class="s">scene reading + OCR</text>
  <text x="610" y="594" class="s">images people share</text>

  <rect x="774" y="526" width="166" height="96" rx="10" class="panel"/>
  <text x="788" y="554" class="t">Ears</text>
  <text x="788" y="578" class="s">live voice chat</text>
  <text x="788" y="594" class="s">speech → text</text>

  <rect x="952" y="526" width="166" height="96" rx="10" class="panel"/>
  <text x="966" y="554" class="t">Singing</text>
  <text x="966" y="578" class="s">full covers in her</text>
  <text x="966" y="594" class="s">voice, hands-free</text>

  <!-- SUPERVISOR -->
  <rect x="62" y="646" width="1056" height="48" rx="10" class="panel"/>
  <text x="590" y="675" class="s" text-anchor="middle"><tspan class="t">Supervisor</tspan>  assumes every service will eventually die, and quietly revives it · the heavy models share one 12 GB GPU, loaded and unloaded around her day</text>

  <line x1="342" y1="694" x2="342" y2="714" class="lnd" marker-end="url(#arr)"/>
  <line x1="883" y1="694" x2="883" y2="714" class="lnd" marker-end="url(#arr)"/>

  <!-- GAME AGENCY -->
  <rect x="62" y="718" width="560" height="180" rx="14" class="panel"/>
  <text x="82" y="748" class="tt"><tspan class="ember">Game agency</tspan></text>
  <text x="82" y="768" class="s">she watches, plays and commentates — pixels in, mouse &amp; keyboard out</text>

  <rect x="82" y="786" width="118" height="76" rx="10" class="chip"/>
  <text x="96" y="812" class="t" font-size="13">Perceive</text>
  <text x="96" y="834" class="s">sees the screen</text>
  <line x1="200" y1="824" x2="214" y2="824" class="ln" marker-end="url(#arr)"/>

  <rect x="216" y="786" width="118" height="76" rx="10" class="chip"/>
  <text x="230" y="812" class="t" font-size="13">Decide</text>
  <text x="230" y="834" class="s">goal → plan</text>
  <line x1="334" y1="824" x2="348" y2="824" class="ln" marker-end="url(#arr)"/>

  <rect x="350" y="786" width="118" height="76" rx="10" class="chip"/>
  <text x="364" y="812" class="t" font-size="13">Act · hands</text>
  <text x="364" y="834" class="s">mouse &amp; keyboard</text>
  <line x1="468" y1="824" x2="482" y2="824" class="ln" marker-end="url(#arr)"/>

  <rect x="484" y="786" width="118" height="76" rx="10" class="safe"/>
  <text x="498" y="812" class="t" font-size="13">Safety rails</text>
  <text x="498" y="830" class="s">no money · locked</text>
  <text x="498" y="844" class="s">to the game · tested</text>

  <!-- EMBODIMENT -->
  <rect x="646" y="718" width="474" height="180" rx="14" class="panel"/>
  <text x="666" y="748" class="tt"><tspan class="ember">Embodiment</tspan></text>
  <text x="666" y="768" class="s">her body on stream</text>

  <rect x="666" y="786" width="180" height="76" rx="10" class="chip"/>
  <text x="680" y="812" class="t" font-size="13">OBS capture</text>
  <text x="680" y="834" class="s">real screen feed</text>
  <line x1="846" y1="824" x2="876" y2="824" class="ln" marker-end="url(#arr)"/>

  <rect x="878" y="786" width="222" height="76" rx="10" class="chip"/>
  <text x="892" y="812" class="t" font-size="13">Stage compositor</text>
  <text x="892" y="830" class="s">parallax room · lighting</text>
  <text x="892" y="844" class="s">animated by her felt state</text>

  <!-- TWO BUILDS -->
  <rect x="62" y="922" width="520" height="64" rx="10" class="panel"/>
  <text x="78" y="948" class="t">EVERYDAY BUILD</text>
  <text x="78" y="968" class="s">everything above on one 12 GB card at home · $0 · fully offline</text>

  <rect x="598" y="922" width="522" height="64" rx="10" class="full"/>
  <text x="614" y="948" class="t">FULL POTENTIAL <tspan class="s">(one launcher flag)</tspan></text>
  <text x="614" y="968" class="s">brain &amp; heavy voice rent horsepower for a session · her mind, memory and life stay home</text>

  <text x="590" y="1016" class="s" text-anchor="middle">typed contracts at every boundary · 2,200+ tests gate every change · she keeps living whether or not anyone is talking</text>
</svg>
