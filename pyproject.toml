[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koroki-ascension"
version = "2.0.0"
description = "Koroki AI Companion - Ascension 2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.44.0",
    "discord.py>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
